<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올머니</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
html, body { margin: 0; height: 100%; background: #e9ecef; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#app { width: 390px; height: 844px; flex: none; border-radius: 44px; overflow: hidden; box-shadow: 0 20px 60px rgba(25, 31, 40, 0.18); transform-origin: center center; background: #ffffff; }
#app.phone { border-radius: 0; box-shadow: none; }
button { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<div id="stage"><div id="app"></div></div>
<template id="tpl">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #ffffff; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; color: #191f28; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased">

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #f2f4f6">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 52px 16px 120px 16px; box-sizing: border-box">

<header style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="0" y="0" width="26" height="26" rx="8" fill="{{accent}}"></rect><circle cx="13" cy="13" r="6" fill="none" stroke="#ffffff" stroke-width="3"></circle><circle cx="17.6" cy="8.4" r="2" fill="#ffffff"></circle></svg>
<span style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px; color: #191f28">올머니</span>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" aria-label="알림" onClick="{{toast}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; color: #4e5968; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg>
<span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: #f04452; border: 1.5px solid #f2f4f6"></span>
</button>
<button type="button" aria-label="전체 메뉴" onClick="{{toast}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4e5968; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 7h15"></path><path d="M4.5 12h15"></path><path d="M4.5 17h15"></path></svg>
</button>
</div>
</header>

<section aria-label="보유 계좌 잔액" style="background: #ffffff; border-radius: 20px; padding: 22px 20px 20px 20px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 28px; height: 28px; border-radius: 50%; background: {{accentTint}}; color: {{accent}}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">홍</span>
<span style="font-size: 15px; font-weight: 600; color: #4e5968">홍길동님의 계좌 잔액</span>
</div>
<button type="button" onClick="{{toggleHide}}" style="height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: #f2f4f6; color: #4e5968; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{hideLabel}}</button>
</div>

<div style="margin-top: 14px; height: 40px; display: flex; align-items: baseline; gap: 2px; font-variant-numeric: tabular-nums">
<sc-if value="{{showBalance}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 32px; font-weight: 700; letter-spacing: -0.8px; color: #191f28">3,482,150</span><span style="font-size: 24px; font-weight: 700; color: #191f28">원</span>
</sc-if>
<sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 24px; font-weight: 700; color: #333d4b; letter-spacing: 1px">잔액 숨김</span>
</sc-if>
</div>

<button type="button" onClick="{{toast}}" style="margin-top: 6px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; color: #4e5968; min-height: 24px; cursor: pointer; text-align: left">
<span>올머니 계좌 3개</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<div style="margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{toast}}" style="height: 48px; border: 0; border-radius: 12px; background: {{accent}}; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">송금</button>
<button type="button" onClick="{{toast}}" style="height: 48px; border: 0; border-radius: 12px; background: #f2f4f6; color: #333d4b; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">거래내역</button>
</div>
</section>

<section aria-label="자주 쓰는 서비스" style="background: #ffffff; border-radius: 20px; padding: 20px 8px 8px 8px; display: flex; flex-direction: column">
<h2 style="margin: 0 12px 8px 12px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px; color: #191f28">자주 쓰는 서비스</h2>

<button type="button" onClick="{{goPay1}}" style="width: 100%; border: 0; background: transparent; font-family: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; min-height: 48px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: {{accentTint}}; color: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="14.5" height="11" rx="2.2"></rect><path d="M2.5 9.5h14.5"></path><path d="M20.5 10.5l-2.6 4.2h3.2l-2.6 4.3"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600; color: #191f28; letter-spacing: -0.2px">카드 대금 즉시결제</span>
<span style="font-size: 15px; color: #4e5968">결제 예정 <span style="font-weight: 600; color: #333d4b; font-variant-numeric: tabular-nums">320,000원</span> · {{dueDate}}</span>
</span>
<svg style="flex: none; color: #b0b8c1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<button type="button" onClick="{{goPen1}}" style="width: 100%; border: 0; background: transparent; font-family: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; min-height: 48px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: #fff1e3; color: #d4690f; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5v-8"></path><path d="M12 12.5c0-3.6-2.6-6-6.5-6 0 3.6 2.6 6 6.5 6z"></path><path d="M12 14.5c0-3.3 2.4-5.5 6.5-5.5 0 3.3-2.4 5.5-6.5 5.5z"></path><path d="M6.5 20.5h11"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600; color: #191f28; letter-spacing: -0.2px">연금 상품</span>
<span style="font-size: 15px; color: #4e5968">연금저축·IRP 비교하고 가입하기</span>
</span>
<svg style="flex: none; color: #b0b8c1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<button type="button" onClick="{{goRem1}}" style="width: 100%; border: 0; background: transparent; font-family: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 14px; min-height: 48px">
<span style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: #eaf0fc; color: #2f5bd0; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17"></path><path d="M12 3.5c2.4 2.5 3.5 5.3 3.5 8.5s-1.1 6-3.5 8.5c-2.4-2.5-3.5-5.3-3.5-8.5s1.1-6 3.5-8.5z"></path></svg>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600; color: #191f28; letter-spacing: -0.2px">해외송금</span>
<span style="font-size: 15px; color: #4e5968">가족·유학 송금을 앱에서 바로</span>
</span>
<svg style="flex: none; color: #b0b8c1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</section>

<button type="button" onClick="{{toast}}" style="width: 100%; border: 0; font-family: inherit; color: inherit; text-align: left; cursor: pointer; background: #ffffff; border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; color: #4e5968">올머니 포인트</span>
<span style="font-size: 20px; font-weight: 700; color: #191f28; letter-spacing: -0.4px; font-variant-numeric: tabular-nums">2,450P</span>
</span>
<span style="display: flex; align-items: center; gap: 2px; font-size: 13px; color: #4e5968">혜택 보기
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</span>
</button>

</div>

<nav aria-label="하단 메뉴" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-top: 1px solid #e5e8eb; padding: 6px 8px 34px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0">
<button type="button" onClick="{{toast}}" style="height: 50px; border: 0; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7684">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5L12 4l8.5 5.5"></path><path d="M6 10.5v7"></path><path d="M10 10.5v7"></path><path d="M14 10.5v7"></path><path d="M18 10.5v7"></path><path d="M3.5 20h17"></path></svg>
<span style="font-size: 12px; font-weight: 500">뱅크</span>
</button>
<button type="button" onClick="{{toast}}" style="height: 50px; border: 0; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7684">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17v3"></path><rect x="4" y="7.5" width="16.5" height="12" rx="2.5"></rect><path d="M16 13.5h1.5"></path></svg>
<span style="font-size: 12px; font-weight: 500">페이</span>
</button>
<button type="button" onClick="{{toast}}" style="height: 50px; border: 0; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #6b7684">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"></rect><path d="M3 10h18"></path><path d="M7 14.5h4"></path></svg>
<span style="font-size: 12px; font-weight: 500">카드</span>
</button>
<button type="button" aria-current="page" onClick="{{toast}}" style="height: 50px; border: 0; background: transparent; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{accent}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 12px; font-weight: 700">홈</span>
</button>
</nav>
</div>
</sc-if>

<sc-if value="{{isPay1}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; display: flex; flex-direction: column; padding-top: 44px; box-sizing: border-box">
<header style="height: 52px; position: relative; display: flex; align-items: center; padding: 0 6px; flex: none">
<button type="button" aria-label="뒤로가기" onClick="{{goBack}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #191f28; cursor: pointer; position: relative; z-index: 1">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12H5"></path><path d="M11 5.5L4.5 12l6.5 6.5"></path></svg>
</button>
<h1 style="position: absolute; left: 60px; right: 60px; margin: 0; text-align: center; font-size: 17px; font-weight: 600; color: #191f28">카드 대금 즉시결제</h1>
</header>

<div style="padding: 28px 24px 0 24px; display: flex; flex-direction: column">
<p style="margin: 0; font-size: 15px; font-weight: 600; color: #4e5968">이번 달 카드 이용금액</p>
<p style="margin: 8px 0 0 0; font-size: 32px; font-weight: 700; letter-spacing: -0.8px; color: #191f28; font-variant-numeric: tabular-nums">320,000원</p>
<p style="margin: 10px 0 0 0; font-size: 15px; line-height: 22px; color: #4e5968">결제 예정일 전에 언제든 미리 갚을 수 있어요.</p>
</div>

<div style="margin: 28px 24px 0 24px; border-top: 1px solid #e5e8eb; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0">
<span style="font-size: 15px; color: #4e5968">결제 예정일</span>
<span style="font-size: 17px; font-weight: 600; color: #333d4b">{{dueDate}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; border-top: 1px solid #f2f4f6">
<span style="font-size: 15px; color: #4e5968; flex: none">결제 계좌</span>
<span style="font-size: 17px; font-weight: 600; color: #333d4b; text-align: right">(주)다른은행 123-456-789</span>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 34px 16px; background: #ffffff">
<button type="button" onClick="{{goPay2}}" style="width: 100%; height: 56px; border: 0; border-radius: 14px; background: {{accent}}; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">즉시결제 하기</button>
</div>
</div>
</sc-if>

<sc-if value="{{isPay2}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; display: flex; flex-direction: column; padding-top: 44px; box-sizing: border-box">
<header style="height: 52px; position: relative; display: flex; align-items: center; padding: 0 6px; flex: none">
<button type="button" aria-label="뒤로가기" onClick="{{goBack}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #191f28; cursor: pointer; position: relative; z-index: 1">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12H5"></path><path d="M11 5.5L4.5 12l6.5 6.5"></path></svg>
</button>
<h1 style="position: absolute; left: 60px; right: 60px; margin: 0; text-align: center; font-size: 17px; font-weight: 600; color: #191f28">카드 대금 즉시결제</h1>
</header>

<div style="padding: 28px 24px 0 24px; display: flex; flex-direction: column">
<label for="olm-pay-amount" style="font-size: 15px; font-weight: 600; color: #4e5968">즉시결제 금액</label>
<div style="margin-top: 10px; display: flex; align-items: center; gap: 4px; border-bottom: 2px solid {{amountLine}}; padding-bottom: 8px">
<input id="olm-pay-amount" type="text" inputMode="numeric" autoComplete="off" value="{{amountText}}" onChange="{{onAmount}}" placeholder="0" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 0; font-family: inherit; font-size: 30px; font-weight: 700; letter-spacing: -0.6px; color: #191f28; font-variant-numeric: tabular-nums">
<span style="flex: none; font-size: 30px; font-weight: 700; color: #191f28">원</span>
</div>
<sc-if value="{{amountOk}}" hint-placeholder-val="{{ true }}">
<p style="margin: 10px 0 0 0; font-size: 13px; color: #4e5968">이번 달 이용금액 320,000원까지 결제할 수 있어요</p>
</sc-if>
<sc-if value="{{amountOver}}" hint-placeholder-val="{{ false }}">
<p style="margin: 10px 0 0 0; font-size: 15px; font-weight: 600; color: #d22030">이용금액 320,000원보다 많이 결제할 수 없어요</p>
</sc-if>
</div>

<sc-if value="{{payAcctVisible}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 24px 0 24px; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600; color: #4e5968">결제 계좌</span>
<div role="group" aria-label="결제 계좌 선택" style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{payAcctList}}" as="item" hint-placeholder-count="1">
<button type="button" onClick="{{item.pick}}" aria-pressed="{{item.pressed}}" style="width: 100%; height: 60px; box-sizing: border-box; border-radius: 14px; border: {{item.border}}; background: {{item.bg}}; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left; cursor: pointer">
<span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: {{item.iconBg}}; color: {{item.iconFg}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{item.letter}}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; font-weight: 600; color: #191f28">{{item.name}}</span>
<span style="font-size: 13px; color: #4e5968; font-variant-numeric: tabular-nums">{{item.num}}</span>
</span>
<span style="flex: none; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{item.selected}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{item.check}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
</button>
</sc-for>
<button type="button" aria-label="다른 계좌 추가" onClick="{{toast}}" style="width: 100%; height: 60px; box-sizing: border-box; border-radius: 14px; border: 1px dashed #d1d6db; background: #ffffff; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left; cursor: pointer">
<span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #f2f4f6; color: #4e5968; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
<span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #4e5968">다른 계좌 추가</span>
<span style="flex: none; width: 22px; height: 22px"></span>
</button>

      },
      reqDisabled: !allAgreed,
      reqBtnBg: allAgreed ? accent : '#e5e8eb',
      reqBtnFg: allAgreed ? '#ffffff' : '#8b95a1',
      isRes: !!res,
      resTitle: res ? res.title : '',
      resDesc: res ? res.desc : '',
      resLabel: res ? res.label : '',
      resValue: res ? res.value : '',
      resDone: function () { nav(self.state.reqReturn || 'home'); },
      openTerms: openTerms,
      termsVisible: !!terms,
      termsTitle: terms ? terms.title : '',
      termsBody: terms ? terms.body : '',
      closeTerms: function () { self.setState({ terms: null }); },
      mainCountries: mainCountries,
      countryList: countryList,
      countryName: curCountry ? curCountry.name : '',
      countryCur: curCountry ? curCountry.cur : '',
      countryLabel: curCountry ? curCountry.name : '국가를 선택해 주세요',
      countryCurLabel: curCountry ? curCountry.cur : '',
      countryAria: curCountry ? '송금 국가 ' + curCountry.name + ', 바꾸기' : '송금 국가 선택하기',
      countryBorder: curCountry ? '1.5px solid ' + accent : '1px solid #d1d6db',
      countryBg: curCountry ? tintC : '#ffffff',
      countryColor: curCountry ? '#191f28' : '#6b7684',
      countryWeight: curCountry ? '600' : '400',
      remAmountText: remDigits ? this.fmt(remNum) : '',
      remAmountFull: this.fmt(remNum) + '원',
      onRemAmount: function (e) {
        var d = String((e && e.target && e.target.value) || '').replace(/\D/g, '').replace(/^0+/, '').slice(0, 10);
        self.applyInput({ remAmount: d });
      },
      goRem3: function () { if (!remDisabled) { nav('rem3'); } },
      recipient: recipient,
      iban: iban,
      onRecipient: function (e) { self.applyInput({ recipient: String((e && e.target && e.target.value) || '').slice(0, 40) }); },
      onIban: function (e) { self.applyInput({ iban: String((e && e.target && e.target.value) || '').slice(0, 40) }); },
      remAcctVisible: remFieldsOk,
      remAcctList: acctItems(OTHER_ACCT, this.state.remAcct, 'remAcct'),
      remDisabled: remDisabled,
      remBtnBg: remDisabled ? '#e5e8eb' : accent,
      remBtnFg: remDisabled ? '#8b95a1' : '#ffffff',
      recipientName: recipient.trim() || 'Hong Gildong',
      isPen1: screen === 'pen1',
      isPen2: screen === 'pen2',
      isPen3: screen === 'pen3',
      goPen2: function () { nav('pen2', { monthly: null, years: null, penAcct: null }); },
      goPen3: function () { if (penReady) { nav('pen3'); } },
      monthChips: monthChips,
      yearChips: yearChips,
      showYears: !!monthly,
      showPenAcct: !!(monthly && years),
      monthlyText: monthly ? this.fmt(monthly) + '원' : '',
      yearsText: years ? years + '년' : '',
      penReady: penReady,
      acctList: acctItems(PEN_ACCTS, penAcctId, 'penAcct'),
      penAcctText: penAcct ? penAcct.name + ' ' + penAcct.num : '',
      penDisabled: !penReady,
      penBtnBg: penReady ? accent : '#e5e8eb',
      penBtnFg: penReady ? '#ffffff' : '#8b95a1',
      amountText: digits ? this.fmt(num) : '',
      amountFull: this.fmt(num) + '원',
      amountOk: !over,
      amountOver: over,
      amountLine: over ? '#d22030' : accent,
      onAmount: function (e) {
        var d = String((e && e.target && e.target.value) || '').replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
        self.applyInput({ amount: d });
      },
      payAcctVisible: payAmountOk,
      payAcctList: acctItems(OTHER_ACCT, this.state.payAcct, 'payAcct'),
      payDisabled: payDisabled,
      payBtnBg: payDisabled ? '#e5e8eb' : accent,
      payBtnFg: payDisabled ? '#8b95a1' : '#ffffff'
    };
  }
}
(function () {
  tpl = document.getElementById('tpl');
  app = document.getElementById('app');
  comp = new Component({"group": "3", "accent": "#0F7A6C", "startScreen": "home", "hideBalance": false});
  render();
  
function fit() {
  var w = window.innerWidth, h = window.innerHeight;
  var phone = w <= 500;
  var s = Math.min(w / 390, h / 844);
  if (!phone) s = Math.min(s * 0.96, 1);
  app.style.transform = 'scale(' + s + ')';
  app.classList.toggle('phone', phone);
}

  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
